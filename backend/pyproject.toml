[project]
name = "odhu-backend"
version = "0.1.0"
description = "Odhu backend: explains bills and letters out loud in Kannada or Hindi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
