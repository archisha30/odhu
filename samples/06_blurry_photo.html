<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sample blurry photo</title>
<style>
  /* Fakes a shaky, badly-lit phone photo of bill 01. The app should say it can't read
     this and ask for a clearer photo, instead of guessing. */
  body { margin: 0; width: 820px; height: 1100px; overflow: hidden; background: #5a5148; }
  img {
    width: 900px;
    margin: 40px -20px;
    transform: rotate(-7deg);
    filter: blur(6px) brightness(0.65) contrast(0.8);
  }
</style>
</head>
<body>
<img src="01_electricity_bill_kn.png" alt="">
</body>
</html>
